<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2b4a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Moved out of styles.css's @import (which forces a serial round-trip —
         the browser has to fetch and start parsing that stylesheet before it
         even discovers the font request) so the preload scanner can kick
         these off in parallel with everything else while it reads the HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    />
    <title>PatiTours · Europa 2027</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
